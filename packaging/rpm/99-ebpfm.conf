# Required by the ebpfm collector's eBPF tier.
#
# Without these two, two of the eight data points the collector adds are inert:
# uninterruptible-sleep (D-state) stall time and the blkio/swapin dwell fields
# read 0 rather than absent -- the worst failure mode for a measurement tool.
#
# Installed by the ebpfm-collector RPM and applied by systemd-sysctl on boot;
# the RPM's %post also applies it immediately so no reboot is required. These
# knobs are not namespaced, so a containerized collector still needs them set
# on the host.
kernel.sched_schedstats = 1
kernel.task_delayacct = 1
